name: LIVESTREAM FFMPEG

on:
  workflow_dispatch:
    inputs:
      ffmpegcom:
        description: 'Command ffmpeg'
        required: true

jobs:
  live-streaming:
    runs-on: ubuntu-latest

    steps:
      - name: cek ubuntu
        run: uname -a
      - name: install ffmpeg
      #  run: sudo apt install ffmpeg -y -qq > /dev/null  
        run: wget https://ftp.ubuntu.com/ubuntu/pool/universe/f/ffmpeg/ffmpeg_6.1.1-3ubuntu5_amd64.deb;dpkg-deb -x ffmpeg_6.1.1-3ubuntu5_amd64.deb ffmpeg6;
      - name: live stream
        run: ${{ github.event.inputs.ffmpegcom }}
