name: LIVESTREAM FFMPEG

on:
  workflow_dispatch:
    inputs:
      ffmpegcom:
        description: 'Command ffmpeg'
        required: true

jobs:
  live-streaming:
    runs-on: ubuntu-latest

    steps:
      - name: cek ubuntu
        run: uname -a
      - name: install ffmpeg
      #  run: sudo apt install ffmpeg -y -qq > /dev/null  
        run: wget https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-linux-x64;mv ffmpeg-linux-x64 ffmpeg;chmod 755 ./ffmpeg;
      - name: live stream
        run: ${{ github.event.inputs.ffmpegcom }}
