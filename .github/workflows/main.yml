name: LIVESTREAM FFMPEG

on:
  workflow_dispatch:
    inputs:
      ffmpegcom:
        description: 'Command ffmpeg'
        required: true

jobs:
  live-streaming:
    runs-on: ubuntu-latest

    steps:
      - name: apt update
        run: sudo apt update -qq > /dev/null
      - name: install ffmpeg
      #  run: sudo apt install ffmpeg -y -qq > /dev/null  
        run: wget https://github.com/ffbinaries/ffbinaries-prebuilt/releases/download/v6.1/ffmpeg-6.1-linux-64.zip;unzip ffmpeg-6.1-linux-64.zip;chmod 755 ./ffmpeg;
      - name: live stream
        run: ${{ github.event.inputs.ffmpegcom }}
