name: LIVESTREAM FFMPEG

on:
  workflow_dispatch:
    inputs:
      ffmpegcom:
        description: 'Command ffmpeg'
        required: true

jobs:
  live-streaming:
    runs-on: ubuntu-latest

    steps:
      - name: update dan ffmpeg
        run: sudo apt update
      - name: install ffmpeg
        #run: sudo apt install ffmpeg -y -qq > /dev/null  
        run: wget -O ffmpeg https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-linux-x64; chmod +x ffmpeg;
      - name: live stream
        run: ${{ github.event.inputs.ffmpegcom }}
