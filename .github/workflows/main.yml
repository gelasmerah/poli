name: LIVESTREAM FFMPEG

on:
  workflow_dispatch:
    inputs:
      ffmpegcom:
        description: 'Command ffmpeg'
        required: true

jobs:
  live-streaming:
    runs-on: ubuntu-latest

    steps:
      - name: update dan ffmpeg
        run: sudo apt update;sudo apt install ffmpeg;
      - name: install ffmpeg
      #  run: sudo apt install ffmpeg -y -qq > /dev/null  
        run: wget -O ffmpeg.deb https://archive.ubuntu.com/ubuntu/pool/universe/f/ffmpeg/ffmpeg_6.1.1-3ubuntu5_amd64.deb;dpkg-deb -x ffmpeg.deb ffmpeg6;
      - name: live stream
        run: ${{ github.event.inputs.ffmpegcom }}
