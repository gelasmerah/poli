name: LIVESTREAM FFMPEG

on:
  workflow_dispatch:
    inputs:
      ffmpegcom:
        description: 'Command ffmpeg'
        required: true

jobs:
  live-streaming:
    runs-on: ubuntu-24.04

    steps:
      - name: update dan ffmpeg
        run: sudo apt update
      - name: install ffmpeg
        run: sudo apt install ffmpeg -y -qq > /dev/null  
      - name: live stream
        run: ${{ github.event.inputs.ffmpegcom }}
